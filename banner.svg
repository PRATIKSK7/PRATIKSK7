<svg width="1200" height="550" viewBox="0 0 1200 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#040914" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#040914" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="550" fill="#040914" rx="16"/>
  <rect width="1200" height="550" fill="url(#bgGlow)" rx="16"/>
  <rect x="1" y="1" width="1198" height="548" fill="none" stroke="#1e293b" rx="16"/>

  <!-- Starry background dots -->
  <g fill="#ffffff" opacity="0.15">
    <circle cx="100" cy="100" r="1"/>
    <circle cx="300" cy="50" r="1.5"/>
    <circle cx="500" cy="200" r="1"/>
    <circle cx="700" cy="80" r="2"/>
    <circle cx="900" cy="500" r="1"/>
    <circle cx="1100" cy="150" r="1.5"/>
    <circle cx="150" cy="400" r="1"/>
    <circle cx="450" cy="480" r="1.5"/>
    <circle cx="1050" cy="450" r="1"/>
  </g>

  <!-- LEFT COLUMN TEXT -->
  <text x="60" y="90" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="24">Hi, I'm 👋</text>
  
  <text x="60" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800">Pratik <tspan fill="#3b82f6">S</tspan> Kanoj</text>
  
  <text x="60" y="220" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24"><tspan fill="#3b82f6" font-weight="600">AI/ML</tspan> Engineer <tspan fill="#475569">|</tspan> Problem Solver <tspan fill="#475569">|</tspan> Builder</text>

  <text x="60" y="280" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
    <tspan x="60" dy="0">I build intelligent AI systems that solve </tspan>
    <tspan fill="#3b82f6" font-weight="600">real-world problems</tspan>
    <tspan x="60" dy="28">and create meaningful impact. From computer vision and</tspan>
    <tspan x="60" dy="28">deep learning to end-to-end AI applications, I turn </tspan>
    <tspan fill="#3b82f6" font-weight="600">ideas</tspan>
    <tspan fill="#cbd5e1"> into </tspan>
    <tspan fill="#3b82f6" font-weight="600">solutions.</tspan>
  </text>

  <!-- FOUR FEATURE BOXES -->
  <g transform="translate(60, 400)">
    <rect width="160" height="54" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <g transform="translate(15, 15)" fill="none" stroke="#3b82f6" stroke-width="2">
       <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
    </g>
    <text x="50" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">AI &amp; Deep</text>
    <text x="50" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Learning</text>
  </g>

  <g transform="translate(235, 400)">
    <rect width="160" height="54" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <g transform="translate(15, 15)" fill="none" stroke="#3b82f6" stroke-width="2">
       <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
       <circle cx="12" cy="12" r="3"/>
    </g>
    <text x="50" y="32" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Computer Vision</text>
  </g>

  <g transform="translate(410, 400)">
    <rect width="160" height="54" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <g transform="translate(15, 15)" fill="none" stroke="#3b82f6" stroke-width="2">
       <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>
    </g>
    <text x="50" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Real-world</text>
    <text x="50" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Solutions</text>
  </g>

  <g transform="translate(585, 400)">
    <rect width="160" height="54" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <g transform="translate(15, 15)" fill="none" stroke="#3b82f6" stroke-width="2">
       <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
    </g>
    <text x="50" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Impact</text>
    <text x="50" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Driven</text>
  </g>

  <!-- BOTTOM QUOTE -->
  <g transform="translate(60, 480)">
    <rect width="1080" height="40" rx="8" fill="#080d1a" stroke="#1e293b"/>
    <text x="30" y="28" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">"</text>
    <text x="540" y="25" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" text-anchor="middle">Code is my <tspan fill="#3b82f6" font-weight="600">tool</tspan>. AI is my <tspan fill="#3b82f6" font-weight="600">power</tspan>. Solving real-world problems is my <tspan fill="#3b82f6" font-weight="600">purpose</tspan>.</text>
    <text x="1050" y="28" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">"</text>
  </g>

  <!-- CONNECTING LINES FOR CARDS -->
  <path d="M850,250 L940,90" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M850,250 L700,210" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M850,250 L940,350" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT SIDE GRAPHICS (AI Globe/Network) -->
  <g transform="translate(850, 250)">
    <!-- Pedestal Base -->
    <g transform="translate(0, 180)">
      <ellipse cx="0" cy="0" rx="180" ry="25" fill="none" stroke="#2563eb" stroke-width="2" filter="url(#glow)" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="160" ry="20" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="5 5" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="100" ry="12" fill="#1e3a8a" opacity="0.5" filter="url(#glow)"/>
      <ellipse cx="0" cy="0" rx="40" ry="5" fill="#ffffff" filter="url(#glow)"/>
      <!-- Upward light beams -->
      <polygon points="-30,0 30,0 100,-280 -100,-280" fill="url(#beamGrad)" opacity="0.1"/>
      <polygon points="-15,0 15,0 40,-280 -40,-280" fill="url(#beamGrad)" opacity="0.2"/>
    </g>
    
    <!-- Globe / Network Core -->
    <circle cx="0" cy="0" r="140" fill="#040914" stroke="#1e3a8a" stroke-width="1"/>
    <circle cx="0" cy="0" r="140" fill="url(#glowGradient)" opacity="0.4"/>
    
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="40" ry="140" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="140" ry="100" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="100" ry="140" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
    
    <!-- Data nodes & connections -->
    <path d="M-90,-70 L30,-120 L80,-80 L110,40 L40,110 L-50,100 L-120,20 Z" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <path d="M-90,-70 L-50,100 M80,-80 L110,40 M0,0 L80,-80 M0,0 L-50,100 M0,0 L-120,20" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
    
    <g fill="#60a5fa">
      <circle cx="-90" cy="-70" r="4" filter="url(#glow)"/>
      <circle cx="80" cy="-80" r="5" filter="url(#glow)"/>
      <circle cx="110" cy="40" r="3"/>
      <circle cx="-50" cy="100" r="5" filter="url(#glow)"/>
      <circle cx="30" cy="-120" r="4"/>
      <circle cx="-120" cy="20" r="3" filter="url(#glow)"/>
      <circle cx="40" cy="110" r="3"/>
    </g>
    
    <!-- Core Center -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#3b82f6"/>
  </g>

  <!-- RIGHT SIDE FLOATING CARDS -->
  <g transform="translate(940, 60)">
    <rect width="210" height="60" rx="10" fill="#0f172a" stroke="#1e293b" opacity="0.95"/>
    <g transform="translate(15, 18)" fill="none" stroke="#94a3b8" stroke-width="2">
       <rect x="4" y="4" width="16" height="16" rx="2" ry="2"/>
       <path d="M9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
    </g>
    <text x="45" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">AI Solutions</text>
    <text x="45" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Smarter systems for a better future</text>
  </g>

  <g transform="translate(640, 180)">
    <rect width="190" height="60" rx="10" fill="#0f172a" stroke="#1e293b" opacity="0.95"/>
    <g transform="translate(15, 18)" fill="none" stroke="#94a3b8" stroke-width="2">
       <circle cx="12" cy="12" r="10"/>
       <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </g>
    <text x="45" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Real-world Impact</text>
    <text x="45" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Solving problems that matter</text>
  </g>

  <g transform="translate(940, 320)">
    <rect width="210" height="60" rx="10" fill="#0f172a" stroke="#1e293b" opacity="0.95"/>
    <g transform="translate(15, 18)" fill="none" stroke="#94a3b8" stroke-width="2">
       <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>
    </g>
    <text x="45" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">End-to-End Dev</text>
    <text x="45" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">From idea to real-world product</text>
  </g>
</svg>
